name: CI/CD - Execucao Service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  IMAGE_NAME: ghcr.io/castor-garage/mecanica-execucao-soat
  EKS_CLUSTER: castor-garage
  AWS_REGION: us-east-1

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: workshop
          POSTGRES_DB: mecanica_execucao_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshop -d mecanica_execucao_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests with coverage
        run: npm run test:coverage -- --config vitest.integration.config.ts
        env:
          TEST_DATABASE_URL: postgresql://workshop:workshop@localhost:5432/mecanica_execucao_test_db

      # Requer o secret SONAR_TOKEN (SonarCloud) configurado no repositorio -
      # ver README para o passo a passo de configuracao.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build e publicar imagem Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop-latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy em produção (main)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configurar credenciais AWS (sessão temporária do Academy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apontar kubectl para o cluster EKS
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER}" --region "${AWS_REGION}" --alias "${EKS_CLUSTER}"

      - name: Aplicar manifesto de namespace
        run: kubectl apply -f k8s/api/overlays/production/namespace.yaml

      # execucao-secret e aplicado manualmente nesse namespace (DATABASE_URL,
      # URLs das filas SQS) - so a chave da New Relic e mantida em dia aqui.
      - name: Atualizar license key da New Relic no Secret (production)
        run: |
          kubectl --context "${EKS_CLUSTER}" -n castor-garage-production patch secret execucao-secret \
            --type merge -p "{\"stringData\":{\"NEW_RELIC_LICENSE_KEY\":\"${NEW_RELIC_LICENSE_KEY}\"}}"
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}

      - name: Patch da tag de imagem (production)
        run: |
          sed -i "s/newTag:.*/newTag: ${GITHUB_SHA}/" k8s/api/overlays/production/kustomization.yaml

      - name: Aplicar configuração via kustomize (production)
        run: kubectl apply -k k8s/api/overlays/production

      - name: Aguardar rollout (production)
        run: kubectl --context "${EKS_CLUSTER}" -n castor-garage-production rollout status deployment/execucao-api --timeout=180s

  deploy-staging:
    name: Deploy em staging (develop)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configurar credenciais AWS (sessão temporária do Academy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apontar kubectl para o cluster EKS
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER}" --region "${AWS_REGION}" --alias "${EKS_CLUSTER}"

      - name: Aplicar manifesto de namespace (staging)
        run: kubectl apply -f k8s/api/overlays/staging/namespace.yaml

      - name: Atualizar license key da New Relic no Secret (staging)
        run: |
          kubectl --context "${EKS_CLUSTER}" -n castor-garage-staging patch secret execucao-secret \
            --type merge -p "{\"stringData\":{\"NEW_RELIC_LICENSE_KEY\":\"${NEW_RELIC_LICENSE_KEY}\"}}"
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}

      - name: Patch da tag de imagem (staging)
        run: |
          sed -i "s/newTag:.*/newTag: ${GITHUB_SHA}/" k8s/api/overlays/staging/kustomization.yaml

      - name: Aplicar configuração via kustomize (staging)
        run: kubectl apply -k k8s/api/overlays/staging

      - name: Aguardar rollout (staging)
        run: kubectl --context "${EKS_CLUSTER}" -n castor-garage-staging rollout status deployment/execucao-api --timeout=180s
